[project]
name = "tree-socu"
version = "0.2.0"
description = "GPU one-level scenario-tree Cholesky solver on SOCU, with cuDSS benchmarks"
requires-python = ">=3.11"
dependencies = [
    # Core solver dependencies only; versions pinned to the environment
    # used for the reported experiments (see environment.yml).  SOCU is
    # the local checkout of branch feature/sequential (base 2ff9dc0).
    "numpy==2.2.6",
    "warp-lang==1.16.0",
    "socu",
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "scipy==1.16.3"]
# benchmark/baseline modules run from the repository checkout and are
# not installed as packages; their extra dependencies:
benchmark = [
    "scipy==1.16.3",
    "nvmath-python[cu12]==0.7.0",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
    "PyYAML==6.0.3",
]

[tool.setuptools]
packages = ["src", "src.kernels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
