[project]
name = "tree-socu"
version = "0.2.0"
description = "GPU direct solver for root-coupled block-tridiagonal SPD systems (Branch MPC), built on SOCU"
requires-python = ">=3.11"
dependencies = [
    # Core solver dependencies only; versions pinned to the environment
    # used for the reported experiments (see environment.yml).  SOCU is
    # https://github.com/PREDICT-EPFL/socu (pip install from git).
    "numpy==2.2.6",
    "scipy==1.16.3",
    "warp-lang==1.16.0",
    "socu",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]
# the cuDSS baseline needs the raw cuDSS bindings of nvmath-python
cudss = ["nvmath-python[cu12]==0.7.0"]
# benchmark/baseline modules run from the repository checkout and are
# not installed as packages; their extra dependencies:
benchmark = [
    "nvmath-python[cu12]==0.7.0",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
    "PyYAML==6.0.3",
]

[tool.setuptools]
packages = [
    "src",
    "src.dense_arrow",
    "src.dense_arrow.kernels",
    "src.endpoint_tree",
    "src.endpoint_tree.kernels",
    "src.endpoint_tree.concept",
]

[tool.pytest.ini_options]
testpaths = ["tests/dense_arrow", "tests/endpoint_tree"]
