# Correctness suite: small systems, every method and generator variant,
# accuracy recorded for each point. Complements the pytest suite with
# runner-level end-to-end checks.
name: correctness

defaults:
  B: 4
  N: 8
  n: 16
  m: 12
  precision: float64
  coupling_pattern: dense
  condition_target: null
  nrhs: 1

seeds: [10, 11, 12]

repetitions:
  warmups: 2
  min_reps: 3
  slow_reps: 3
  min_seconds: 0.05
  max_reps: 10

estimate_condition: true

methods:
  tree_socu: {kind: tree}
  cudss: {kind: cudss, ordering: default}
  cpu_structured: {kind: cpu, variant: structured}
  cpu_sparse: {kind: cpu, variant: sparse}

sweeps:
  - name: default_point
  - name: edge_dimensions
    points:
      - {B: 1, N: 8, n: 16, m: 12}
      - {B: 4, N: 1, n: 16, m: 12}
      - {B: 4, N: 8, n: 16, m: 1}
      - {B: 4, N: 8, n: 4, m: 12}
  - name: coupling_patterns
    param: coupling_pattern
    values: [dense, root_only, terminal_only, banded_separator]
  - name: conditioning
    param: condition_target
    values: [1.0e+2, 1.0e+4, 1.0e+6]
  - name: strong_coupling
    points:
      - {rho_tail: 2.0, rho_sep: 5.0}
  - name: generator_modes
    param: generator_mode
    values: [factor, diagonal_dominant]
  - name: fp32
    param: precision
    values: [float32]
    methods: [tree_socu, cudss, cpu_structured]
  - name: multi_rhs
    param: nrhs
    values: [4]
    methods: [tree_socu, cudss, cpu_structured]
