# Smoke test: a few minutes end to end, exercises every method and the
# runner machinery (resume, memory guard, metrics, phases).
name: smoke

defaults:
  B: 8
  N: 16
  n: 16
  m: 16
  precision: float64
  coupling_pattern: dense
  condition_target: 1.0e4
  nrhs: 1
  rho_tail: 0.5
  rho_sep: 1.0

seeds: [10]

repetitions:
  warmups: 3
  min_reps: 5
  slow_reps: 3
  min_seconds: 0.2
  max_reps: 50

methods:
  tree_socu:
    kind: tree
  cudss:
    kind: cudss
    ordering: default
  cpu_structured:
    kind: cpu
    variant: structured

sweeps:
  - name: default_point
  - name: branches
    param: B
    values: [2, 8, 32]
  - name: multi_rhs
    param: nrhs
    values: [1, 4]
    methods: [tree_socu, cudss]
