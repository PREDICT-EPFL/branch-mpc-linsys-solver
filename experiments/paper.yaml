# Full paper sweep (plan sections 9 and 11), restricted to the practically
# relevant regime of at most ~81 branches and N <= 128 stages (user
# decision; see the target_points sweep for the application operating
# points).
# Resumable: rerun the same command after an interruption and completed
# cases are skipped.
name: paper

defaults:
  B: 64
  N: 128
  n: 16
  m: 64
  precision: float64
  coupling_pattern: dense
  condition_target: 1.0e+4
  nrhs: 1
  rho_tail: 0.5
  rho_sep: 1.0

seeds: [10, 11, 12]

repetitions:
  warmups: 10
  min_reps: 30
  slow_reps: 10
  slow_threshold_ms: 200.0
  min_seconds: 1.0
  max_reps: 300

memory_guard_fraction: 0.8
# condition estimation is expensive at scale; enabled per sweep below
estimate_condition: false

methods:
  # proposed path (plan 2): factor-space formulation, batched SOCU,
  # fused factor-and-forward, lower-triangle Schur, deterministic
  # pairwise reduction
  tree_socu: {kind: tree}
  tree_graph: {kind: tree, options: {use_cuda_graph: true}}
  cudss: {kind: cudss, ordering: default}
  cpu_structured: {kind: cpu, variant: structured, max_dimension: 40000}

sweeps:
  # ---- application target points (user-specified operating points) ------
  # (B, N, n) pairs of practical interest; m stays at the default 64.
  - name: target_points
    points:
      - {B: 11, N: 32, n: 8}
      - {B: 21, N: 64, n: 8}
      - {B: 41, N: 96, n: 8}
      - {B: 81, N: 128, n: 8}
    methods: [tree_socu, tree_graph, cudss, cpu_structured]
  - name: target_points_fp32
    overrides: {precision: float32}
    points:
      - {B: 11, N: 32, n: 8}
      - {B: 21, N: 64, n: 8}
      - {B: 41, N: 96, n: 8}
      - {B: 81, N: 128, n: 8}
    methods: [tree_socu, tree_graph, cudss]

  # ---- required one-dimensional sweeps (plan 9.1-9.6) -------------------
  - name: branches
    param: B
    values: [1, 2, 4, 8, 16, 32, 64]
    methods: [tree_socu, cudss, cpu_structured]
  - name: horizon
    param: N
    values: [8, 16, 32, 64, 128]
    methods: [tree_socu, cudss, cpu_structured]
  - name: block_size
    param: n
    values: [4, 8, 16, 24, 32, 48, 64]
    methods: [tree_socu, cudss]
  - name: separator
    param: m
    values: [8, 16, 32, 64, 128, 256]
    methods: [tree_socu, cudss]
  - name: multi_rhs
    param: nrhs
    values: [1, 4, 16, 64]
    methods: [tree_socu, cudss]
  - name: conditioning
    param: condition_target
    values: [1.0e+2, 1.0e+4, 1.0e+6]
    estimate_condition: true
    methods: [tree_socu, cudss]

  # ---- shape and scaling studies ----------------------------------------
  - name: shape_constant_work        # B*N held near 2048, n fixed
    points:
      - {B: 16, N: 128}
      - {B: 32, N: 64}
      - {B: 64, N: 32}
    methods: [tree_socu, cudss]
  - name: grid_BN                    # heatmap over (B, N)
    grid:
      B: [2, 8, 32, 64]
      N: [8, 32, 64, 128]
    methods: [tree_socu, cudss]
  - name: total_scaling              # grow B and N together to the default
    points:
      - {B: 8, N: 16}
      - {B: 16, N: 32}
      - {B: 32, N: 64}
      - {B: 64, N: 128}
    methods: [tree_socu, cudss]
  - name: coupling_strength
    points:
      - {rho_tail: 0.1, rho_sep: 0.1}
      - {rho_tail: 0.1, rho_sep: 5.0}
      - {rho_tail: 2.0, rho_sep: 0.1}
      - {rho_tail: 2.0, rho_sep: 5.0}
    methods: [tree_socu, cudss]

  # ---- FP32 subset -------------------------------------------------------
  - name: fp32_subset
    points:
      - {precision: float32}
      - {precision: float32, B: 8, N: 16}
      - {precision: float32, n: 64}
      - {precision: float32, m: 256}
      - {precision: float32, condition_target: 1.0e+2}
      - {precision: float32, condition_target: 1.0e+6}
    estimate_condition: true
    methods: [tree_socu, cudss]

  # ---- ablations; small / default / large each ---------------------------
  - name: ablation_graph
    points:
      - {B: 8, N: 16}
      - {B: 32, N: 64}
      - {}
    methods: [tree_socu, tree_graph]
  - name: ablation_coupling_pattern
    param: coupling_pattern
    values: [dense, root_only, terminal_only, banded_separator]
    methods: [tree_socu, cudss]
  - name: ablation_generator
    param: generator_mode
    values: [factor, diagonal_dominant]
    overrides: {B: 16, N: 32}
    methods: [tree_socu, cudss]
